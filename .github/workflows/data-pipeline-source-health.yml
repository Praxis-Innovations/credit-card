name: Data pipeline source-health

# Daily light check of verified catalog sourceUrls (GET + claim presence).
# Failures flip Supabase rows to status=stale when secrets are configured.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-pipeline-source-health
  cancel-in-progress: true

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run source-health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PIPELINE_REVIEWER: pipeline:source-health
        run: pnpm --filter @northtap/core pipeline:source-health

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: |
            packages/core/src/data-pipeline/reports/source-health-latest.md
            packages/core/src/data-pipeline/reports/source-health-latest.json

      - name: Commit health report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data-pipeline): source-health report"
          branch: data-pipeline/staging
          create_branch: true
          file_pattern: |
            packages/core/src/data-pipeline/reports/source-health-latest.*

      - name: Upsert / comment health issue when failures
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/core/src/data-pipeline/reports/source-health-latest.json';
            const mdPath = 'packages/core/src/data-pipeline/reports/source-health-latest.md';
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            if (!report.summary || report.summary.failed === 0) {
              console.log('No source-health failures');
              return;
            }
            const body = [
              '_Daily source-health detected failures. Verified rows may have been marked `stale` in Supabase._',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              fs.readFileSync(mdPath, 'utf8'),
            ].join('\n');
            const title = 'Data pipeline source-health failures';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `New failures from run ${context.runId} (${report.summary.failed} failed, ${report.summary.markedStale} marked stale).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
