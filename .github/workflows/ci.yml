name: CI

# Test gate for every PR and every push to main. See docs/ci.md.
#
# Adding a job (code health, e2e, ...): give it a `uses: ./.github/actions/setup`
# step and append its id to `ci-gate.needs`. Branch protection only requires
# "CI gate", so new jobs become blocking without touching repo settings.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  unit:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: ${{ matrix.task }}

      - name: Run ${{ matrix.task }}
        run: >-
          pnpm turbo run ${{ matrix.task }}
          --filter=api
          --filter=admin
          --filter=crawler
          --filter=mobile
          --filter=web

  api-coverage:
    name: api coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: api-coverage

      - name: Run api coverage
        run: pnpm --filter api test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-summary
          path: apps/api/coverage/coverage-summary.json
          if-no-files-found: error

  code-health:
    name: code-health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: code-health

      - name: Code-health (new violations vs baseline)
        run: pnpm code-health

  # Playwright smoke against local Supabase (Docker). Full suite: e2e.yml (nightly).
  e2e-smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e-smoke

      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start local Supabase + seed
        uses: ./.github/actions/e2e-supabase

      - name: Build and start app stack
        run: bash e2e/scripts/stack-up.sh

      - name: Run Playwright smoke
        run: |
          eval "$(bash e2e/scripts/export-supabase-env.sh)"
          pnpm --filter e2e run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-smoke-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop app stack
        if: always()
        run: bash e2e/scripts/stack-down.sh || true

      - name: Stop local Supabase
        if: always()
        run: npx -y supabase@2.121.0 stop || true

  ci-gate:
    name: CI gate
    if: always()
    needs: [unit, api-coverage, code-health, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required CI job did not succeed ($result)."; exit 1 ;;
            esac
          done
