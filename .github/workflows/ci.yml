name: CI

# Test gate for every PR and every push to main. See docs/ci.md.
#
# PRs run only the jobs their paths can affect (see `changes` job).
# `main` / merge queue / manual dispatch still run everything.
# Branch protection only requires "CI gate", so skipped jobs stay green
# and new jobs become blocking when appended to `ci-gate.needs`.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.out.outputs.unit }}
      api: ${{ steps.out.outputs.api }}
      e2e: ${{ steps.out.outputs.e2e }}
    steps:
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unit:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'supabase/**'
              - 'code-health/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'knip.json'
              - '.jscpd.json'
              - '*.ts'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
            api:
              - 'apps/api/**'
              - 'packages/**'
            e2e:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'apps/admin/**'
              - 'apps/mobile/**'
              - 'e2e/**'
              - 'packages/**'
              - 'supabase/**'

      - name: Set outputs
        id: out
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "unit=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit=${{ steps.filter.outputs.unit }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint

      - name: Run lint
        run: >-
          pnpm turbo run lint
          --filter=api
          --filter=admin
          --filter=crawler
          --filter=mobile
          --filter=web
          --filter=e2e

  unit:
    name: ${{ matrix.task }}
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: ${{ matrix.task }}

      - name: Run ${{ matrix.task }}
        run: >-
          pnpm turbo run ${{ matrix.task }}
          --filter=api
          --filter=admin
          --filter=crawler
          --filter=mobile
          --filter=web
          --filter=e2e

  api-coverage:
    name: api coverage
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: api-coverage

      - name: Run api coverage
        run: pnpm --filter api test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-summary
          path: apps/api/coverage/coverage-summary.json
          if-no-files-found: error

  code-health:
    name: code-health
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: code-health

      - name: Code-health (new violations vs baseline)
        run: pnpm code-health

  # Playwright smoke against local Supabase (Docker). Full suite: e2e.yml (nightly).
  e2e-smoke:
    name: e2e smoke
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e-smoke

      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start local Supabase + seed
        uses: ./.github/actions/e2e-supabase

      - name: Build and start app stack
        run: bash e2e/scripts/stack-up.sh

      - name: Run Playwright smoke
        run: |
          eval "$(bash e2e/scripts/export-supabase-env.sh)"
          pnpm --filter e2e run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-smoke-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop app stack
        if: always()
        run: bash e2e/scripts/stack-down.sh || true

      - name: Stop local Supabase
        if: always()
        run: npx -y supabase@2.121.0 stop || true

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, lint, unit, api-coverage, code-health, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required CI job did not succeed ($result)."; exit 1 ;;
            esac
          done
