name: Data pipeline promote

# Human-gated promotion of approved findings into Supabase catalog tables.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Never commit service-role keys.

on:
  workflow_dispatch:
    inputs:
      approvals_path:
        description: "Path to approvals JSON in the repo"
        required: true
        default: "apps/api/src/data-pipeline/approvals.example.json"
      dry_run:
        description: "Skip Supabase writes (still updates local review-decisions)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-pipeline-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit can be rebased onto the latest branch tip.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Promote
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPROVALS_PATH: ${{ inputs.approvals_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--file "$GITHUB_WORKSPACE/$APPROVALS_PATH")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          pnpm --filter api pipeline:promote -- "${ARGS[@]}"

      - name: Commit local review decisions
        run: |
          .github/scripts/commit-and-push.sh rebase "$GITHUB_REF_NAME" \
            "chore(data-pipeline): apply review decisions" \
            apps/api/src/data-pipeline/state/review-decisions.json
