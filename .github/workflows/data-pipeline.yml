name: Data pipeline (Big Six)

# Weekly crawl → staging JSON + review report.
# Never promotes into cards.ts / partnerships.ts.

on:
  schedule:
    # Monday 14:00 UTC — off-peak for CA bank sites; weekly is enough for fee/partnership drift.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-pipeline-big-six
  cancel-in-progress: false

jobs:
  crawl-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test diff logic
        run: pnpm --filter @northtap/core test -- src/data-pipeline/diff.test.ts

      - name: Run pipeline
        run: pnpm --filter @northtap/core pipeline:run

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: big-six-pipeline-${{ github.run_id }}
          path: |
            packages/core/src/data-pipeline/staging/latest.json
            packages/core/src/data-pipeline/reports/latest.md
            packages/core/src/data-pipeline/reports/latest.json

      - name: Commit staging + report to data-pipeline/staging
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data-pipeline): refresh Big Six staging + review report"
          branch: data-pipeline/staging
          create_branch: true
          file_pattern: |
            packages/core/src/data-pipeline/staging/**
            packages/core/src/data-pipeline/reports/**

      - name: Upsert review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/core/src/data-pipeline/reports/latest.md';
            const body = fs.readFileSync(reportPath, 'utf8');
            const title = 'Data pipeline review: Big Six';
            const header = [
              '_Automated weekly staging crawl. **Do not** treat this as production.',
              '_Promotion into `cards.ts` / `partnerships.ts` requires human verification._',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Staging branch: \`data-pipeline/staging\``,
              '',
            ].join('\n');
            const fullBody = header + body;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: fullBody,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Updated from run ${context.runId} (${new Date().toISOString()}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: fullBody,
              });
            }
