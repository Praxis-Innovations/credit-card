name: Data pipeline (Big Six)

# Risk-based crawl → staging JSON + review report.
# Never auto-promotes into cards.ts / partnerships.ts / Supabase.

on:
  schedule:
    # 1st of month 14:00 UTC — full (cards + partnerships)
    - cron: "0 14 1 * *"
    # 15th of month 14:00 UTC — partnerships / promos only (bi-weekly)
    - cron: "0 14 15 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Crawl scope"
        type: choice
        options:
          - full
          - cards
          - partnerships
        default: partnerships

permissions:
  contents: write
  issues: write

concurrency:
  group: data-pipeline-big-six
  cancel-in-progress: false

jobs:
  crawl-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=partnerships" >> "$GITHUB_OUTPUT"
          fi

      - name: Test pipeline unit tests
        run: pnpm --filter @northtap/core test -- src/data-pipeline

      - name: Run pipeline
        env:
          PIPELINE_SCOPE: ${{ steps.scope.outputs.value }}
          # Optional: load remote rejected fingerprints / future health hooks
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @northtap/core pipeline:run

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: big-six-pipeline-${{ github.run_id }}
          path: |
            packages/core/src/data-pipeline/staging/latest.json
            packages/core/src/data-pipeline/reports/latest.md
            packages/core/src/data-pipeline/reports/latest.json
            packages/core/src/data-pipeline/state/review-decisions.json

      - name: Commit staging + report to data-pipeline/staging
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data-pipeline): refresh Big Six staging + review report"
          branch: data-pipeline/staging
          create_branch: true
          file_pattern: |
            packages/core/src/data-pipeline/staging/**
            packages/core/src/data-pipeline/reports/**
            packages/core/src/data-pipeline/state/**

      - name: Upsert review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/core/src/data-pipeline/reports/latest.md';
            const body = fs.readFileSync(reportPath, 'utf8');
            const title = 'Data pipeline review: Big Six';
            const header = [
              '_Automated risk-based staging crawl. **Do not** treat this as production._',
              '_Promote with `pipeline:promote` (Supabase `status=verified`) or reject fingerprints so they stop re-flagging._',
              '',
              `Scope: \`${{ steps.scope.outputs.value }}\``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Staging branch: \`data-pipeline/staging\``,
              '',
            ].join('\n');
            const fullBody = header + body;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: fullBody,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Updated from run ${context.runId} (${new Date().toISOString()}, scope=${{ steps.scope.outputs.value }}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: fullBody,
              });
            }
