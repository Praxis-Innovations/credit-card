name: Setup workspace
description: >
  Install pnpm (version from package.json `packageManager`), Node with the pnpm
  store cached, workspace dependencies from the frozen lockfile, and restore the
  turbo local cache.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "22"
  turbo-cache-key:
    description: >
      Namespace for the turbo cache entry (e.g. the task name), so parallel jobs
      don't overwrite each other's cache.
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # Each run saves a new entry keyed by commit; restore-keys picks up the most
    # recent entry for this namespace so unchanged packages are cache hits.
    - name: Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-
